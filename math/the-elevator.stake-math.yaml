---
stake_math_version: 1
game:
  id: the-elevator
  name: The Elevator

description: |
  Two-mode crash-style multiplier game with a rare "elevate" mode.
  - Base mode multipliers in [1.01, 10,000] with survival S_base(m) = 1/m on the open interval.
  - Elevate mode multipliers in [1,000, 100,000] with conditional survival S_elev(m) = (1000/m)^alpha on the open interval.
  - Elevate mode triggers with probability p_elev per round; otherwise base mode is used.
  - Unconditional survival S(m) = (1 - p_elev) * S_base(m) + p_elev * S_elev(m), with piecewise handling to respect supports.
  - Displayed payout applies a house edge factor e: displayed = m * (1 - e).
  - Costs: base = 1.0, elevate = 3.0.

defaults:
  p_elev: 0.001     # Probability of elevate mode
  alpha: 1.0        # Tail exponent for elevate mode
  e: 0.02           # House edge applied to multipliers

parameters:
  p_elev:
    type: float
    default: 0.001
    min: 0.0
    max: 1.0
    description: Probability that a round is elevate mode
  alpha:
    type: float
    default: 1.0
    min: 0.0000001
    description: Tail exponent for elevate mode; alpha > 0
  e:
    type: float
    default: 0.02
    min: 0.0
    max: 1.0
    description: House edge fraction applied to multipliers

constants:
  m_min_base: 1.01
  m_max_base: 10000.0
  m_min_elev: 1000.0
  m_max_elev: 100000.0
  cost_base: 1.0
  cost_elev: 3.0

variables:
  m:
    description: Outcome multiplier
    domain: [1.01, 100000.0]

modes:
  base:
    activation_prob: "1 - p_elev"
    cost: cost_base
    support: [m_min_base, m_max_base]
  elevate:
    activation_prob: "p_elev"
    cost: cost_elev
    support: [m_min_elev, m_max_elev]

# Survival and density functions
functions:
  # By convention these survivals are right-continuous at the upper bound,
  # and set to 1 at and below the lower bound to reflect the minimum multiplier.
  S_base(m):
    description: Base mode survival; S_base(m) = 1/m on (m_min_base, m_max_base)
    piecewise:
      - when: "m <= m_min_base"
        value: 1.0
      - when: "m_min_base < m and m < m_max_base"
        value: "1.0 / m"
      - when: "m >= m_max_base"
        value: 0.0

  f_base(m):
    description: Base mode PDF on the open interval; atoms listed separately
    piecewise:
      - when: "m_min_base < m and m < m_max_base"
        value: "1.0 / (m^2)"
      - when: "otherwise"
        value: 0.0

  atoms_base:
    # Atom at lower bound due to the jump from S=1 (at/below m_min_base) to S=1/m_min_base just above it
    - at: "m_min_base"
      prob: "1.0 - (1.0 / m_min_base)"
    # Atom at upper bound due to the drop to S=0 above m_max_base
    - at: "m_max_base"
      prob: "(1.0 / m_max_base)"

  S_elev(m):
    description: Elevate mode survival; S_elev(m) = (m_min_elev / m)^alpha on (m_min_elev, m_max_elev)
    piecewise:
      - when: "m <= m_min_elev"
        value: 1.0
      - when: "m_min_elev < m and m < m_max_elev"
        value: "(m_min_elev / m)^alpha"
      - when: "m >= m_max_elev"
        value: 0.0

  f_elev(m):
    description: Elevate mode PDF on the open interval; atom at upper bound listed separately
    piecewise:
      - when: "m_min_elev < m and m < m_max_elev"
        value: "alpha * (m_min_elev^alpha) * m^(-alpha - 1)"
      - when: "otherwise"
        value: 0.0

  atoms_elev:
    # No atom at lower bound (continuous at m_min_elev), only at upper bound
    - at: "m_max_elev"
      prob: "(m_min_elev / m_max_elev)^alpha"

  # Unconditional survival is a mixture across modes, respecting supports
  S_uncond(m):
    description: Unconditional survival S(m) = (1 - p_elev) S_base(m) + p_elev S_elev(m)
    piecewise:
      - when: "m <= m_min_base"
        value: "1.0"
      - when: "m_min_base < m and m < m_min_elev"
        value: "(1 - p_elev) * (1.0 / m) + p_elev * 1.0"
      - when: "m_min_elev <= m and m < m_max_base"
        value: "(1 - p_elev) * (1.0 / m) + p_elev * (m_min_elev / m)^alpha"
      - when: "m_max_base <= m and m < m_max_elev"
        value: "p_elev * (m_min_elev / m)^alpha"
      - when: "m >= m_max_elev"
        value: 0.0

  f_uncond(m):
    description: Unconditional PDF on the open intervals
    piecewise:
      - when: "m_min_base < m and m < m_min_elev"
        value: "(1 - p_elev) * (1.0 / m^2)"
      - when: "m_min_elev < m and m < m_max_base"
        value: "(1 - p_elev) * (1.0 / m^2) + p_elev * alpha * (m_min_elev^alpha) * m^(-alpha - 1)"
      - when: "m_max_base < m and m < m_max_elev"
        value: "p_elev * alpha * (m_min_elev^alpha) * m^(-alpha - 1)"
      - when: "otherwise"
        value: 0.0

  atoms_uncond:
    - at: "m_min_base"
      prob: "(1 - p_elev) * (1.0 - 1.0 / m_min_base)"
    - at: "m_max_base"
      prob: "(1 - p_elev) * (1.0 / m_max_base)"
    - at: "m_max_elev"
      prob: "p_elev * (m_min_elev / m_max_elev)^alpha"

# Payouts and costs
payouts:
  raw_multiplier: "m"
  displayed_multiplier: "(1.0 - e) * m"
  per_mode:
    base:
      cost: cost_base
      net: "displayed_multiplier - cost_base"
    elevate:
      cost: cost_elev
      net: "displayed_multiplier - cost_elev"

# Expectations (symbolic forms)
expectations:
  # Conditional expectations of m including open-interval integrals and boundary atoms
  E_m_base:
    expr: "m_min_base + ln(m_max_base / m_min_base)"  # = (m_min_base)*(1 - 1/m_min_base) + ∫(1/m) + (m_max_base)*(1/m_max_base)
  E_m_elev:
    piecewise:
      - when: "alpha == 1"
        value: "m_min_elev * (1 + ln(m_max_elev / m_min_elev))"  # interior + atom at m_max_elev
      - when: "alpha != 1"
        value: "(alpha * (m_min_elev^alpha) * (m_max_elev^(1 - alpha) - m_min_elev^(1 - alpha)) / (1 - alpha)) + m_max_elev * (m_min_elev / m_max_elev)^alpha"
  E_display_base:
    expr: "(1.0 - e) * E_m_base"
  E_display_elev:
    expr: "(1.0 - e) * E_m_elev"

  expected_cost_per_round:
    expr: "(1 - p_elev) * cost_base + p_elev * cost_elev"

  expected_displayed_payout_per_round:
    expr: "(1 - p_elev) * E_display_base + p_elev * E_display_elev"

  expected_net_per_round:
    expr: "expected_displayed_payout_per_round - expected_cost_per_round"

  rtp:
    description: Return-to-player on displayed payouts relative to average cost
    expr: "expected_displayed_payout_per_round / expected_cost_per_round"
